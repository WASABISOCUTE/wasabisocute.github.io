<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles Portal | WASABISOCUTE</title>

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 50%, #1e1e3f, #070712 70%, #020205);
      --card-bg: rgba(12, 12, 28, 0.7);
      --card-border: rgba(120, 140, 255, 0.25);
      --card-border-glow: rgba(120, 140, 255, 0.8);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.5);
      --glow-purple: #a855f7;
      --glow-pink: #ec4899;
      --glow-cyan: #06b6d4;

      /* Gradients for Article Covers */
      --cover-neon-dusk: linear-gradient(135deg, #a855f7, #6366f1);
      --cover-cyber-sunset: linear-gradient(135deg, #f43f5e, #fb923c);
      --cover-cosmic-abyss: linear-gradient(135deg, #06b6d4, #3b82f6);
      --cover-emerald-glow: linear-gradient(135deg, #10b981, #06b6d4);
      --cover-aurora-borealis: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(10, 10, 20, 0.5);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(120, 140, 255, 0.3);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(120, 140, 255, 0.6);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Cosmic Background Stars */
    .stars {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
        radial-gradient(circle at 80% 40%, rgba(255, 255, 255, 0.15) 1.5px, transparent 1.5px),
        radial-gradient(circle at 40% 70%, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
        radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.1) 2px, transparent 2px),
        radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.05) 3px, transparent 3px);
      background-size: 250px 250px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
      animation: spacetwinkle 60s linear infinite;
    }

    @keyframes spacetwinkle {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 500px 1000px;
      }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      background: rgba(10, 10, 25, 0.7);
      border-bottom: 1px solid rgba(120, 140, 255, 0.15);
      padding: 15px 30px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .logo-symbol {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-color), var(--glow-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .back-home {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-home:hover {
      color: #fff;
      transform: translateX(-2px);
    }

    /* Main Content Container */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px;
      z-index: 1;
      position: relative;
    }

    .view-section {
      display: block;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* EXPLORE VIEW STYLES */
    .explore-header {
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .explore-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-filter-bar {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(120, 140, 255, 0.15);
      padding: 12px 16px 12px 40px;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.2s;
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }

    .filter-btn.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent-color);
      color: #c7d2fe;
    }

    /* Language Filter Segment Group */
    .language-filter-group {
      display: flex;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(120, 140, 255, 0.15);
      border-radius: 12px;
      padding: 3px;
      gap: 2px;
      align-items: center;
    }

    .lang-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 7px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.05);
    }

    .lang-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(129, 140, 248, 0.2));
      border-color: rgba(99, 102, 241, 0.4);
      color: #e0e7ff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.2);
    }

    .article-lang-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(10, 10, 25, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 2;
    }

    /* Article Grid & Cards */
    .article-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 30px;
    }

    /* List View styling */
    .article-grid.list-view {
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .article-grid.list-view .article-card {
      flex-direction: row;
      height: 200px;
    }

    @media (max-width: 768px) {
      .article-grid.list-view .article-card {
        flex-direction: column;
        height: auto;
      }

      .article-grid.list-view .article-cover {
        width: 100% !important;
        height: 180px !important;
      }
    }

    .article-grid.list-view .article-cover {
      width: 300px;
      height: 100%;
      flex-shrink: 0;
    }

    .article-grid.list-view .article-body {
      padding: 20px 24px;
      justify-content: center;
      width: 100%;
      min-width: 0;
    }

    .article-grid.list-view .article-title {
      margin-bottom: 6px;
      -webkit-line-clamp: 1;
    }

    .article-grid.list-view .article-excerpt {
      margin-bottom: 12px;
      -webkit-line-clamp: 2;
    }

    .article-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 440px;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
      position: relative;
      animation: cardEntrance 0.5s ease-out forwards;
    }

    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .article-card:hover {
      transform: translateY(-8px);
      border-color: var(--card-border-glow);
      box-shadow: 0 15px 35px rgba(120, 140, 255, 0.15), 0 0 25px rgba(99, 102, 241, 0.1);
    }

    .article-cover {
      height: 180px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .article-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.5s;
    }

    .article-card:hover .article-cover-img {
      transform: scale(1.05);
    }

    .cover-gradient-default {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: rgba(255, 255, 255, 0.7);
    }

    .article-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(10, 10, 25, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      backdrop-filter: blur(4px);
    }

    .article-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .article-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .article-author-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 10px;
      color: white;
    }

    .article-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .article-excerpt {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    .article-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
      margin-top: auto;
    }

    .article-tags {
      display: flex;
      gap: 6px;
      overflow: hidden;
      mask-image: linear-gradient(90deg, #000 80%, transparent 100%);
    }

    .tag-pill {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      white-space: nowrap;
    }

    .read-more-link {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: 0.2s;
    }

    .article-card:hover .read-more-link {
      color: #818cf8;
      transform: translateX(3px);
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      color: var(--text-muted);
    }

    .no-results svg {
      font-size: 48px;
      margin-bottom: 15px;
      color: rgba(120, 140, 255, 0.4);
    }

    /* Markdown rendered styles */
    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3 {
      font-family: 'Space Grotesk', sans-serif;
      color: white;
      margin: 20px 0 10px;
    }

    .markdown-content h1 {
      font-size: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 6px;
    }

    .markdown-content h2 {
      font-size: 20px;
    }

    .markdown-content h3 {
      font-size: 16px;
    }

    .markdown-content p {
      font-size: 14.5px;
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 15px;
    }

    .markdown-content blockquote {
      border-left: 3px solid var(--accent-color);
      background: rgba(99, 102, 241, 0.05);
      padding: 10px 15px;
      margin: 15px 0;
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: #94a3b8;
    }

    .markdown-content ul,
    .markdown-content ol {
      margin: 10px 0 15px 20px;
      color: #cbd5e1;
    }

    .markdown-content li {
      margin-bottom: 6px;
      font-size: 14px;
    }

    .markdown-content pre {
      background: rgba(10, 10, 20, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 15px 0;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
    }

    .markdown-content code {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f43f5e;
    }

    .markdown-content pre code {
      background: transparent;
      padding: 0;
      color: #e2e8f0;
    }

    .markdown-content a {
      color: var(--accent-color);
      text-decoration: none;
    }

    .markdown-content a:hover {
      text-decoration: underline;
    }

    /* Modal Overlay and Container */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 12, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: rgba(15, 15, 32, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      width: 100%;
      max-width: 800px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(120, 140, 255, 0.15);
      transform: scale(0.95);
      transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-container {
      transform: scale(1);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close-btn {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: 0.2s;
    }

    .modal-close-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .modal-scroll-body {
      overflow-y: auto;
      padding: 24px;
      flex: 1;
    }

    .reader-cover {
      height: 240px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      font-size: 36px;
      font-weight: bold;
      color: white;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .reader-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .reader-category {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid var(--accent-color);
      color: #c7d2fe;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .reader-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: white;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .reader-subtitle {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-weight: 400;
      line-height: 1.5;
    }

    .reader-meta {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 13px;
      color: var(--text-muted);
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 24px;
    }

    /* Notification Toast */
    .toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--accent-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(99, 102, 241, 0.2);
      color: white;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 500;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .toast.active {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-icon {
      color: #10b981;
      font-size: 16px;
    }

    /* Footer Styles */
    footer {
      border-top: 1px solid rgba(120, 140, 255, 0.1);
      padding: 30px 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      backdrop-filter: blur(8px);
      background: rgba(8, 8, 18, 0.6);
      margin-top: auto;
      z-index: 1;
    }

    footer a {
      color: var(--accent-color);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- Cosmic Twinkle Background -->
  <div class="stars"></div>

  <!-- STICKY NAVBAR -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-symbol">W</div>
        <span>WASABISOCUTE</span>
      </a>

      <div style="display: flex; gap: 12px; align-items: center;">
        <a href="index.html" class="back-home">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back Profile
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN AREA -->
  <main>

    <!-- EXPLORE / BLOG LISTING -->
    <section class="view-section">
      <div class="explore-header">
        <div class="explore-title-bar">
          <h1 class="section-title">Explore Articles 🌌</h1>
        </div>

        <div class="search-filter-bar">
          <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

          <div class="language-filter-group" id="view-filters">

                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>

            <button class="lang-btn" onclick="setViewMode('list')" id="view-btn-list">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: middle;">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>

          <div class="filter-buttons" id="category-filters">
            <button class="filter-btn active" onclick="setCategoryFilter('all')">All Articles</button>
            <button class="filter-btn" onclick="setCategoryFilter('tech')">Tech</button>
            <button class="filter-btn" onclick="setCategoryFilter('science')">Science</button>
            <button class="filter-btn" onclick="setCategoryFilter('video edit')">Video Edit</button>
            <button class="filter-btn" onclick="setCategoryFilter('life')">Life</button>
            <button class="filter-btn" onclick="setCategoryFilter('fun facts')">Fun Facts</button>

      <!-- Articles Grid -->
      <div class="article-grid" id="articles-container">
        <!-- Dynamically Populated -->
      </div>

  </main>

  <!-- MODAL: ARTICLE READER -->
  <div class="modal-overlay" id="reader-modal" onclick="closeReaderModal(event)">
    <div class="modal-container" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span
          style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: var(--text-muted); font-size: 14px; display: flex; align-items: center; gap: 5px;">
          📖 Currently Reading
        </span>
        <button class="modal-close-btn" onclick="closeReaderModal(null)">✕</button>
      </div>

      <div class="modal-scroll-body markdown-content">
        <div id="modal-cover" class="reader-cover"></div>
        <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
          <div id="modal-category" class="reader-category" style="margin-bottom: 0;">Tech</div>
          <div id="modal-lang" class="reader-category"
            style="margin-bottom: 0; background: rgba(255, 255, 255, 0.05); border-color: rgba(120, 140, 255, 0.2); color: #c7d2fe;">
            EN</div>
        </div>
        <h1 id="modal-title" class="reader-title">Sample Article Title</h1>
        <p id="modal-subtitle" class="reader-subtitle">Sample description of this beautiful article</p>

        <div id="modal-meta" class="reader-meta">
          <div class="article-author-avatar" id="modal-author-avatar">W</div>
          <span id="modal-author-name">WASABISOCUTE</span>
          <span>•</span>
          <span id="modal-date">May 18, 2026</span>
          <span>•</span>
          <span id="modal-readtime">3 min read</span>
        </div>

        <div id="modal-content-body">
          <!-- Populated by markdown parsing -->
        </div>
      </div>
    </div>
  </div>

  <!-- NOTIFICATION TOAST -->
  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <span id="toast-message">Success message</span>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 <a href="index.html">WASABISOCUTE</a>. Cosmic Articles Platform. Built with absolute premium
      aesthetics.</p>
  </footer>

  <!-- SCRIPT LOGIC -->
  <script>
    // APPLICATION STATE
    let articles = [];
    let currentCategoryFilter = 'all';
    let currentLanguageFilter = 'all';
    let currentViewMode = localStorage.getItem('articles_view_mode') || 'grid';

    // INITIALIZATION
    window.onload = function () {
      // Dynamically load articles-data.js with cache-busting parameter to prevent caching issues
      const script = document.createElement('script');
      script.src = 'articles-data.js?v=' + Date.now();
      script.onload = function () {
        initStorage();
        renderArticlesList();
        setViewMode(currentViewMode);
      };
      script.onerror = function () {
        console.error('Failed to load articles-data.js');
        initStorage();
        renderArticlesList();
        setViewMode(currentViewMode);
      };
      document.head.appendChild(script);
    };

    function initStorage() {
      const stored = localStorage.getItem('local_articles');
      const currentPresets = typeof presetArticles !== 'undefined' ? presetArticles : [];
      if (!stored) {
        localStorage.setItem('local_articles', JSON.stringify(currentPresets));
        articles = [...currentPresets];
      } else {
        try {
          const storedArticles = JSON.parse(stored);
          const presetIds = new Set(currentPresets.map(art => art.id));

          // Keep user custom articles (articles not present in current presets)
          const userArticles = storedArticles.filter(art => art.id && !presetIds.has(art.id));

          // Merge fresh presets with user custom articles
          articles = [...currentPresets, ...userArticles];
        } catch (e) {
          articles = [...currentPresets];
        }

        // Normalize older categories to the new allowed set
        const allowed = ['tech', 'science', 'video edit', 'life', 'fun facts', 'news'];
        articles.forEach(art => {
          if (!art.category || !allowed.includes(art.category.toLowerCase())) {
            if (art.category === 'design') {
              art.category = 'tech';
            } else if (art.category === 'thoughts') {
              art.category = 'life';
            } else {
              art.category = 'tech';
            }
          }
          if (!art.lang) {
            art.lang = 'en';
          }
        });
        localStorage.setItem('local_articles', JSON.stringify(articles));
      }
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      localStorage.setItem('articles_view_mode', mode);

      const container = document.getElementById('articles-container');
      if (container) {
        if (mode === 'list') {
          container.classList.add('list-view');
        } else {
          container.classList.remove('list-view');
        }
      }

      // Update UI active state on view toggles
      document.querySelectorAll('#view-filters button').forEach(btn => {
        btn.classList.remove('active');
      });
      const activeBtn = document.getElementById(`view-btn-${mode}`);
      if (activeBtn) {
        activeBtn.classList.add('active');
      }
    }

    // ARTICLE RENDERING & FILTERING
    function renderArticlesList() {
      const container = document.getElementById('articles-container');
      container.innerHTML = '';

      const query = document.getElementById('article-search').value.toLowerCase();

      const filtered = articles.filter(art => {
        const matchesCategory = currentCategoryFilter === 'all' || art.category === currentCategoryFilter;

        // Support language filtering, default to 'en' if not specified
        const articleLang = art.lang || 'en';
        const matchesLanguage = currentLanguageFilter === 'all' || articleLang === currentLanguageFilter;

        const tagsString = art.tags ? art.tags.join(' ').toLowerCase() : '';
        const matchesSearch = art.title.toLowerCase().includes(query) ||
          art.subtitle.toLowerCase().includes(query) ||
          art.author.toLowerCase().includes(query) ||
          tagsString.includes(query);

        return matchesCategory && matchesLanguage && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="no-results">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            <h3 style="margin-top: 10px; color: white;">No Articles Found</h3>
            <p style="font-size: 13px; margin-top: 5px;">Try adjusting your keywords or category filters, or write a new one!</p>
          </div>
        `;
        return;
      }

      // Sort: newest first (by date)
      const sorted = [...filtered].sort((a, b) => {
        const dateA = new Date(a.date || 0);
        const dateB = new Date(b.date || 0);
        const timeA = isNaN(dateA.getTime()) ? 0 : dateA.getTime();
        const timeB = isNaN(dateB.getTime()) ? 0 : dateB.getTime();
        return timeB - timeA;
      });

      sorted.forEach(art => {
        const card = document.createElement('div');
        card.className = 'article-card';
        card.onclick = () => openReaderModal(art.id);

        // Get cover styling
        let coverHtml = '';
        if (art.coverType === 'preset') {
          coverHtml = `<div class="article-cover" style="background: var(--cover-${art.coverValue});"></div>`;
        } else {
          coverHtml = `
            <div class="article-cover">
              <img class="article-cover-img" src="${art.coverValue}" alt="${art.title}" onerror="this.src='https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=600'">
            </div>`;
        }

        // Tags markup
        const tagsMarkup = art.tags ? art.tags.map(t => `<span class="tag-pill">#${t}</span>`).join('') : '';

        // Author Avatar Markup
        const resolvedAvatar = getAuthorAvatar(art.author, art.authorAvatar);
        let avatarMarkup = '';
        if (resolvedAvatar) {
          avatarMarkup = `<img src="${resolvedAvatar}" alt="${art.author}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
        } else {
          avatarMarkup = art.author ? art.author.charAt(0).toUpperCase() : '?';
        }

        // Language label flag
        const langLabel = (art.lang === 'zh') ? '🇨🇳 中文' : '🇬🇧 EN';
        const langBadgeHtml = `<div class="article-lang-badge">${langLabel}</div>`;

        card.innerHTML = `
          ${coverHtml}
          <div class="article-badge">${art.category}</div>
          ${langBadgeHtml}
          <div class="article-body">
            <div class="article-meta">
              <div class="article-author-avatar" style="${resolvedAvatar ? 'background: none;' : ''}">${avatarMarkup}</div>
              <span>${art.author}</span>
              <span>•</span>
              <span>${art.date}</span>
            </div>
            <h3 class="article-title">${art.title}</h3>
            <p class="article-excerpt">${art.subtitle || art.content.slice(0, 120) + '...'}</p>
            <div class="article-footer">
              <div class="article-tags">${tagsMarkup}</div>
              <span class="read-more-link">
                Read
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
              </span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setCategoryFilter(category) {
      currentCategoryFilter = category;
      document.querySelectorAll('#category-filters button').forEach(btn => {
        btn.classList.remove('active');
        if (btn.innerText.toLowerCase().includes(category) || (category === 'all' && btn.innerText.includes('All'))) {
          btn.classList.add('active');
        }
      });
      renderArticlesList();
    }

    function setLanguageFilter(lang) {
      currentLanguageFilter = lang;
      document.querySelectorAll('#language-filters button').forEach(btn => {
        btn.classList.remove('active');
      });
      const targetBtn = Array.from(document.querySelectorAll('#language-filters button')).find(btn =>
        btn.getAttribute('onclick').includes(`'${lang}'`)
      );
      if (targetBtn) {
        targetBtn.classList.add('active');
      }
      renderArticlesList();
    }

    function filterArticles() {
      renderArticlesList();
    }

    // A lightweight, highly efficient Markdown Compiler
    function compileMarkdown(md) {
      if (!md) return '';
      let html = md;

      // Escape HTML entities to prevent XSS
      html = html
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Recover quotes & gt signs for blockquotes and code
      html = html.replace(/^&gt;\s+(.*)$/gm, '<blockquote>$1</blockquote>');
      // Merge adjacent blockquotes
      html = html.replace(/<\/blockquote>\n<blockquote>/g, '<br>');

      // Code blocks ```language ... ```
      html = html.replace(/```(?:[a-zA-Z0-9]+)?\n([\s\S]*?)\n```/g, '<pre><code>$1</code></pre>');

      // Inline code `code`
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Bold **text**
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

      // Italic *text*
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

      // Headers # to ###
      html = html.replace(/^#\s+(.*)$/gm, '<h1>$1</h1>');
      html = html.replace(/^##\s+(.*)$/gm, '<h2>$1</h2>');
      html = html.replace(/^###\s+(.*)$/gm, '<h3>$1</h3>');

      // Links [text](url)
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

      // Unordered lists - or *
      html = html.replace(/^\s*[-*]\s+(.*)$/gm, '<li>$1</li>');
      // Wrap lists
      html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
      // Remove double wraps
      html = html.replace(/<\/ul>\n<ul>/g, '');

      // Line breaks
      html = html.replace(/\n\n/g, '<p></p>');
      html = html.replace(/\n/g, '<br>');

      return html;
    }

    // SYSTEM MODALS LOGIC
    function openReaderModal(articleId) {
      const art = articles.find(a => a.id === articleId);
      if (!art) return;

      const modal = document.getElementById('reader-modal');

      // Populate fields
      document.getElementById('modal-title').innerText = art.title;
      document.getElementById('modal-subtitle').innerText = art.subtitle || '';
      document.getElementById('modal-author-name').innerText = art.author;

      const modalAvatarContainer = document.getElementById('modal-author-avatar');
      const resolvedAvatar = getAuthorAvatar(art.author, art.authorAvatar);
      if (resolvedAvatar) {
        modalAvatarContainer.style.background = 'none';
        modalAvatarContainer.innerHTML = `<img src="${resolvedAvatar}" alt="${art.author}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
      } else {
        modalAvatarContainer.style.background = 'var(--accent-color)';
        modalAvatarContainer.innerHTML = art.author.charAt(0).toUpperCase();
      }

      document.getElementById('modal-category').innerText = art.category.toUpperCase();

      const langLabel = (art.lang === 'zh') ? '🇨🇳 中文专栏' : '🇬🇧 ENGLISH COLUMN';
      document.getElementById('modal-lang').innerText = langLabel;

      document.getElementById('modal-date').innerText = art.date;
      document.getElementById('modal-readtime').innerText = art.readTime;

      // Set Cover
      const cover = document.getElementById('modal-cover');
      if (art.coverType === 'preset') {
        cover.style.background = `var(--cover-${art.coverValue})`;
        cover.innerHTML = '';
      } else {
        cover.style.background = 'none';
        cover.innerHTML = `<img src="${art.coverValue}" onerror="this.parentElement.style.background='var(--cover-neon-dusk)'">`;
      }

      // Compile content body
      document.getElementById('modal-content-body').innerHTML = compileMarkdown(art.content);

      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; // Lock background scroll
    }

    function closeReaderModal(e) {
      if (!e || e.target === document.getElementById('reader-modal') || e === null) {
        document.getElementById('reader-modal').classList.remove('active');
        document.body.style.overflow = '';
      }
    }

    // TOAST NOTIFICATIONS
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = message;
      toast.classList.add('active');

      setTimeout(() => {
        toast.classList.remove('active');
      }, 4000);
    }
  </script>

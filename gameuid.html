<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game UID | WASABISOCUTE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #1e1e3f, #070712 70%, #020205);
            --card-bg: rgba(12, 12, 28, 0.6);
            --card-border: rgba(120, 140, 255, 0.2);
            --card-border-glow: rgba(120, 140, 255, 0.6);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --success-color: #10b981;
            --success-glow: rgba(16, 185, 129, 0.4);
            --warning-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(10, 10, 20, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(120, 140, 255, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(120, 140, 255, 0.6);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Cosmic Background Stars */
        .stars {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                radial-gradient(circle at 80% 40%, rgba(255, 255, 255, 0.15) 1.5px, transparent 1.5px),
                radial-gradient(circle at 40% 70%, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.1) 2px, transparent 2px),
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.05) 3px, transparent 3px);
            background-size: 250px 250px;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
            animation: spacetwinkle 60s linear infinite;
        }

        @keyframes spacetwinkle {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 500px 1000px;
            }
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background: rgba(10, 10, 25, 0.7);
            border-bottom: 1px solid rgba(120, 140, 255, 0.15);
            padding: 15px 30px;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .logo-symbol {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent-color), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .back-home {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(120, 140, 255, 0.2);
            background: rgba(10, 10, 20, 0.4);
            padding: 6px 14px;
            border-radius: 8px;
        }

        .back-home:hover {
            color: #fff;
            border-color: rgba(120, 140, 255, 0.6);
            background: rgba(120, 140, 255, 0.1);
            transform: translateX(-2px);
        }

        /* Main Layout */
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            z-index: 1;
            position: relative;
        }

        .page-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--text-muted));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Language Selector Styling */
        .lang-select-wrapper select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(120, 140, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .lang-select-wrapper select:hover {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }

        .lang-select-wrapper select option {
            background: #070712;
            color: white;
        }

        /* Search & Filter Controls */
        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(15, 15, 30, 0.4);
            border: 1px solid rgba(120, 140, 255, 0.1);
            padding: 20px;
            border-radius: 16px;
            backdrop-filter: blur(8px);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(120, 140, 255, 0.15);
            padding: 12px 16px 12px 42px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
            background: rgba(255, 255, 255, 0.07);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 16px;
            height: 16px;
            pointer-events: none;
        }

        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .filter-btn.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--accent-color);
            color: #c7d2fe;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.15);
        }

        .stats-summary {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Game Card Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
            overflow: show;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .game-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--theme-gradient, linear-gradient(135deg, transparent, transparent));
            opacity: 0.03;
            transition: opacity 0.3s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--card-theme-color, var(--card-border-glow));
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4), 0 0 20px var(--theme-glow, rgba(120, 140, 255, 0.15));
            z-index: 50;
        }

        .game-card:hover::before {
            opacity: 0.08;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            z-index: 1;
        }

        .platform-badges {
            display: flex;
            gap: 5px;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-platform {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge-status {
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.1);
        }

        .status-inactive {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
            z-index: 1;
            line-height: 1.3;
        }

        .game-server {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            z-index: 1;
        }

        .uid-display {
            margin-top: auto;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
        }

        .uid-text {
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 10px;
        }

        .copy-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .copy-icon-btn:hover {
            color: #fff;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Modal Styling */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 2, 8, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-card {
            background: rgba(10, 10, 24, 0.85);
            border: 1px solid rgba(120, 140, 255, 0.3);
            border-radius: 24px;
            width: 100%;
            max-width: 860px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px var(--theme-glow, rgba(99, 102, 241, 0.2));
            display: flex;
            flex-direction: column;
            margin: auto;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-container {
            display: flex;
            flex-direction: column;
        }

        .modal-left {
            position: relative;
            width: 100%;
            background: var(--theme-gradient, linear-gradient(135deg, #1e1e3f, #070712));
            min-height: 200px;
            /* only used when no screenshot (fallback) */
        }

        .modal-screenshot {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.92;
            position: relative;
            z-index: 0;
        }

        .modal-left-fallback {
            position: absolute;
            inset: 0;
            background: var(--theme-gradient, linear-gradient(135deg, #1e1e3f, #070712));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            z-index: 1;
        }

        .fallback-logo {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Space Grotesk', sans-serif;
            filter: drop-shadow(0 0 10px var(--theme-glow, rgba(255, 255, 255, 0.4)));
        }

        .fallback-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .modal-right {
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .modal-close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 10;
        }

        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: rotate(90deg);
        }

        .modal-game-info {
            margin-bottom: 24px;
        }

        .modal-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .modal-game-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }

        .modal-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-val {
            color: #fff;
            font-weight: 500;
        }

        .modal-copy-section {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(120, 140, 255, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .modal-uid-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .modal-uid-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px 14px;
            font-family: 'Fira Code', monospace;
            font-size: 16px;
        }

        .modal-uid-text {
            color: #fff;
            font-weight: 600;
            user-select: all;
        }

        .modal-copy-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .modal-copy-btn:hover {
            background: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px var(--accent-glow);
        }

        .modal-copy-btn.copied {
            background: var(--success-color);
            box-shadow: 0 4px 12px var(--success-glow);
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        .btn-action {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .btn-download {
            background: linear-gradient(135deg, var(--accent-color), #a855f7);
            color: #fff;
            border: none;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .btn-download.disabled {
            opacity: 0.55;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
        }

        .btn-download.disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .modal-user-input-section {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(120, 140, 255, 0.15);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: none;
            flex-direction: column;
            gap: 10px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .modal-user-input-section.active {
            display: flex;
        }

        .modal-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(120, 140, 255, 0.15);
            padding: 12px 14px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .modal-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
            background: rgba(255, 255, 255, 0.07);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #fff;
            border: none;
            margin-top: 5px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background: linear-gradient(135deg, #128C7E, #075E54);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(10, 10, 24, 0.9);
            border: 1px solid var(--success-color);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--success-glow);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        .toast.active {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-icon {
            color: var(--success-color);
            width: 18px;
            height: 18px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 60px;
        }

        footer a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #fff;
        }

        /* SVGs and Utilities */
        .svg-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Card Warning Icon */
        .card-note-badge {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.4);
            border-radius: 50%;
            color: #fbbf24;
            font-size: 11px;
            font-weight: 700;
            cursor: default;
            flex-shrink: 0;
            transition: background 0.2s, border-color 0.2s;
        }

        .card-note-badge:hover {
            background: rgba(251, 191, 36, 0.25);
            border-color: rgba(251, 191, 36, 0.7);
        }

        .card-note-badge .note-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            background: rgba(10, 10, 24, 0.97);

        function detectDeviceType() {
            const ua = navigator.userAgent || '';
            const platform = navigator.platform || '';
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
            const isConsole = /Xbox|PlayStation|Nintendo|Switch|Wii|WiiU/i.test(ua);
            const isPS5 = /PS5|PlayStation 5/i.test(ua);
            const isTouchMac = /MacIntel/i.test(platform) && navigator.maxTouchPoints > 1;

            if (isPS5) return 'PS5';
            if (isConsole) return 'Console';
            if (isMobile || isTouchMac) return 'Mobile';
            return 'PC';
        }

        function isPlatformSupported(platformText, deviceType) {
            const normalizedPlatform = platformText.toLowerCase();
            if (normalizedPlatform.includes('mobile') && deviceType === 'Mobile') return true;
            if (normalizedPlatform.includes('pc') && deviceType === 'PC') return true;
            if (normalizedPlatform.includes('ps5') && deviceType === 'PS5') return true;
            if (normalizedPlatform.includes('console') && deviceType === 'Console') return true;
            return false;
        }

                card.style.setProperty('--card-theme-color', game.theme.color);
                card.style.setProperty('--theme-glow', game.theme.glow);
                card.style.setProperty('--theme-gradient', game.theme.gradient);

                const statusClass = game.installed ? "status-active" : "status-inactive";
                const statusText = game.installed ? currentDict.active : currentDict.inactive;

                let gameDisplayName = game.name;
                if (currentLang === 'zh' && game.name_zh) gameDisplayName = game.name_zh;
                if (currentLang === 'ja' && game.name_ja) gameDisplayName = game.name_ja;
                let gameNote = null;
                if (game.note) {
                    gameNote = typeof game.note === 'object' ? (game.note[currentLang] || game.note.en || game.note.zh) : game.note;
                }
                card.innerHTML = `
          <div class="card-header">
            <span class="badge badge-platform">${game.platform.split(' / ')[0]}</span>
            
            <span class="badge badge-status ${game.installed ? 'status-active' : 'status-inactive'}">
              ${statusText}
            </span>
            
          </div>
          <h3 class="game-title">${gameDisplayName} ${gameNote ? `<span class="card-note-badge" title="">
              !
              <span class="note-tooltip">${gameNote}</span>
            </span>` : ''}</h3>
          <p class="game-server">${game.server}</p>
          <div class="uid-display">
            ${game.uid
                        ? `<span class="uid-text" title="${game.uid}">${game.uid}</span>
                 <button class="copy-icon-btn" title="Click to copy UID" data-uid="${game.uid}">
                   <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" fill="currentColor"/></svg>
                 </button>`
                        : `<span class="uid-text" style="font-style:italic;color:rgba(255,255,255,0.35);">Unavailable</span>`
                    }
          </div>
        `;

                card.addEventListener("click", (e) => {
                    if (e.target.closest(".copy-icon-btn")) {
                        copyToClipboard(game.uid);
                        showToast();
                        return;
                    }
                    openModal(game);
                });

                gameGrid.appendChild(card);
            });
        }

        function openModal(game) {
            activeGame = game;
            const currentDict = i18n[currentLang];

            modalCard.style.setProperty('--theme-gradient', game.theme.gradient);
            modalCard.style.setProperty('--theme-glow', game.theme.glow);

            const uidText = (game.uid || "").trim();
            const displayUid = uidText || (currentLang === 'zh' ? '不适用' : (currentLang === 'ja' ? '不適用' : 'Unavailable'));
            modalUidText.textContent = displayUid;
            if (uidText) {
                modalUidText.style.fontStyle = "";
                modalUidText.style.color = "";
                modalCopyBtn.style.display = "";
            } else {
                modalUidText.style.fontStyle = "italic";
                modalUidText.style.color = "rgba(255, 255, 255, 0.35)";
                modalCopyBtn.style.display = "none";
            }

            let gameDisplayName = game.name;
            if (currentLang === 'zh' && game.name_zh) gameDisplayName = game.name_zh;
            if (currentLang === 'ja' && game.name_ja) gameDisplayName = game.name_ja;
            modalGameTitle.textContent = gameDisplayName;

            modalGameServer.textContent = getTransText(game.server);
            modalGamePlatform.textContent = getTransText(game.platform);
            modalGameIgn.textContent = game.ign;
            modalJoinDate.textContent = game.dateJoined;

            modalStatusBadge.className = `badge badge-status ${game.installed ? 'status-active' : 'status-inactive'}`;
            modalStatusBadge.textContent = game.installed ? currentDict.active : currentDict.inactive;

            let gameNote = null;
            if (game.note) {
                gameNote = typeof game.note === 'object' ? (game.note[currentLang] || game.note.en || game.note.zh) : game.note;
            }

            userUidInput.value = "";
            userNameInput.value = "";
            userMessageInput.value = "";
            modalUserInputSection.classList.remove("active");

            if (gameNote) {
                modalNoteBox.style.display = "flex";
                modalNoteText.innerHTML = gameNote;
            } else {
                modalNoteBox.style.display = "none";
            }
            modalCopyBtn.className = "modal-copy-btn";
            modalCopyBtn.querySelector("span").textContent = currentDict.copyUid;

            const dlBtn = modalDownloadBtn;
            const deviceType = detectDeviceType();
            const supportedOnDevice = isPlatformSupported(game.platform, deviceType);
            if (game.download) {
                dlBtn.style.display = "flex";
                if (supportedOnDevice) {
                    dlBtn.classList.remove('disabled');
                    dlBtn.removeAttribute('aria-disabled');
                    dlBtn.title = currentDict.getGame;
                    dlBtn.href = game.download.pc || game.download.android || game.download.ios || "#";
                    downloadBtnText.textContent = currentDict.getGame;
                } else {
                    dlBtn.classList.add('disabled');
                    dlBtn.setAttribute('aria-disabled', 'true');
                    dlBtn.title = currentDict.notSupported;
                    dlBtn.href = '#';
                    downloadBtnText.textContent = currentDict.notSupported;
                }
            } else {
                dlBtn.style.display = "none";
            }

            const screenshotUrl = `picture/screenshots/${game.id}.jpg`;
            modalScreenshot.src = screenshotUrl;

            modalScreenshot.onload = function () {
                modalScreenshot.style.display = "block";
                modalFallback.style.display = "none";
            };

            modalScreenshot.onerror = function () {
                modalScreenshot.style.display = "none";
                modalFallback.style.display = "flex";
                modalFallbackLogo.textContent = game.theme.logo || "UID";
                modalFallbackTitle.textContent = gameDisplayName;
                modalLeft.style.background = game.theme.gradient;
            };
            detailModal.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            detailModal.classList.remove("active");
            document.body.style.overflow = "";
            activeGame = null;
        }

        langSelect.addEventListener("change", (e) => {
            currentLang = e.target.value;
            localStorage.setItem('selectedLanguage', currentLang);

            updateStaticTexts();
            renderCards();
        });

        function copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text).catch(() => { });
        }

        function showToast() {
            copyToast.classList.add("active");
            setTimeout(() => copyToast.classList.remove("active"), 2500);
        }

        modalCopyBtn.addEventListener("click", () => {
            if (activeGame && activeGame.uid) {
                copyToClipboard(activeGame.uid);
                modalCopyBtn.className = "modal-copy-btn copied";
                modalCopyBtn.querySelector("span").textContent = i18n[currentLang].copied;
                showToast();
            }
        });

        toggleWaBtn.addEventListener("click", () => {
            modalUserInputSection.classList.toggle("active");
        });

        sendWaBtn.addEventListener("click", () => {
            const uid = userUidInput.value.trim();
            if (!uid) {
                alert(i18n[currentLang].errUidRequired);
                return;
            }
            const name = userNameInput.value.trim();
            const msg = userMessageInput.value.trim();
            const gameName = modalGameTitle.textContent;

            let text = `${gameName}: ${uid}\n`;
            text += `<${name || 'Anonymous'}>: ${msg || ''}`;

            const contact = atob("NjAxMTIwOTA0MTgy");
            const waUrl = `https://wa.me/${contact}?text=${encodeURIComponent(text)}`;
            window.open(waUrl, '_blank');
        });

        modalCloseBtn.addEventListener("click", closeModal);
        detailModal.addEventListener("click", (e) => { if (e.target === detailModal) closeModal(); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

        searchInput.addEventListener("input", (e) => {
            searchQuery = e.target.value;
            renderCards();
        });

        langSelect.value = currentLang;
        updateStaticTexts();
        renderCards();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | WASABISOCUTE</title>
  <link rel="icon" type="image/x-icon" href="/picture/favicon.ico">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, #2b2b5a, #0b0b18 60%, #05050b);
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    /* background */
    .stars {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.35), transparent 25%),
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.25), transparent 25%),
        radial-gradient(circle at 60% 70%, rgba(255, 255, 255, 0.2), transparent 25%),
        radial-gradient(circle at 40% 80%, rgba(255, 255, 255, 0.18), transparent 25%);
      opacity: 0.7;
      pointer-events: none;
      animation: twinkle 8s infinite alternate;
    }

    @keyframes twinkle {
      from {
        opacity: 0.4;
      }

      to {
        opacity: 0.8;
      }
    }

    .card {
      background: rgba(10, 10, 20, 0.6);
      border: 1px solid rgba(120, 140, 255, 0.4);
      border-radius: 18px;
      padding: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .profile {
      text-align: center;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px solid rgba(120, 140, 255, 0.9);
      box-shadow: 0 0 20px rgba(120, 140, 255, 0.7);
      object-fit: cover;
    }

    h1 {
      margin: 14px 0 6px;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .bio {
      color: #a6b0c3;
      font-size: 14px;
    }

    .links {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .links a {
      text-decoration: none;
      color: #cbd5f5;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(120, 140, 255, 0.5);
      background: rgba(10, 10, 20, 0.5);
      transition: 0.2s;
    }

    .links a:hover {
      background: rgba(120, 140, 255, 0.2);
      border-color: rgba(120, 140, 255, 0.9);
      transform: translateY(-2px);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 40px 0 16px;
      border-bottom: 1px solid rgba(120, 140, 255, 0.3);
      padding-bottom: 10px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .articles-link {
      font-size: 13.5px;
      color: #cbd5f5;
      opacity: 0.65;
      text-decoration: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(120, 140, 255, 0.2);
      background: rgba(10, 10, 20, 0.4);
      padding: 5px 12px;
      border-radius: 8px;
    }

    .articles-link:hover {
      opacity: 1;
      border-color: rgba(120, 140, 255, 0.7);
      background: rgba(120, 140, 255, 0.1);
      transform: translateY(-1px);
    }

    .repos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .repo {
      background: rgba(10, 10, 20, 0.6);
      border: 1px solid rgba(120, 140, 255, 0.25);
      border-radius: 14px;
      padding: 14px;
      transition: 0.2s;
    }

    .repo:hover {
      transform: translateY(-4px);
      border-color: rgba(120, 140, 255, 0.9);
      box-shadow: 0 10px 25px rgba(120, 140, 255, 0.25);
    }

    .repo a {
      color: #cbd5f5;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }

    .repo p {
      margin-top: 8px;
      color: #a6b0c3;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="stars"></div>

  <div class="container">
    <div class="card">
      <div class="profile">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/93391433?v=4" alt="avatar">
        <h1>WASABISOCUTE</h1>
        <div class="bio">...</div>

        <div class="links">
          <a href="https://github.com/WASABISOCUTE" target="_blank">GitHub</a>
          <a href="https://instagram.com/wasabisimyeezhe_ws" target="_blank">Instagram</a>
          <a href="mailto:wasabi9487@gmail.com">Email</a>
        </div>
      </div>

      <div class="section-header">
        <h2>My Repositories</h2>
        <div style="display: flex; gap: 10px;">
          <a href="articles-show.html" class="articles-link">
            Articles 📝
          </a>
        </div>
      </div>
      <div id="repos" class="repos"></div>
    </div>
  </div>

  <script>
    const username = "WASABISOCUTE";
    const repoContainer = document.getElementById("repos");

    fetch(`https://api.github.com/users/${username}/repos`)
      .then(res => res.json())
      .then(repos => {
        repos.sort((a, b) => b.stargazers_count - a.stargazers_count)
          .forEach(repo => {
            const div = document.createElement("div");
            div.className = "repo";
            div.innerHTML = `
              <a href="${repo.html_url}" target="_blank">${repo.name}</a>
              <p>${repo.description || "No description"}</p>
            `;
            repoContainer.appendChild(div);
          });
      })
      .catch(() => {
        repoContainer.innerHTML = "<p>仓库加载失败</p>";
      });
  </script>
</body>

</html>

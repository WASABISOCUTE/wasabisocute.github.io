<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Links | WASABISOCUTE</title>
    <link rel="icon" type="image/x-icon" href="/picture/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #1e1e3f, #070712 70%, #020205);
            --card-border: rgba(120, 140, 255, 0.4);
            --card-border-glow: rgba(120, 140, 255, 0.6);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-bg-hover: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 16px;
        }

        .stars {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                radial-gradient(circle at 80% 40%, rgba(255, 255, 255, 0.15) 1.5px, transparent 1.5px),
                radial-gradient(circle at 40% 70%, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.1) 2px, transparent 2px),
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.05) 3px, transparent 3px);
            background-size: 250px 250px;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
            animation: spacetwinkle 60s linear infinite;
        }

        @keyframes spacetwinkle {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 500px 1000px;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-wrapper {
            position: relative;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: rgba(12, 12, 28, 0.6);
            border: 2px solid var(--card-border);
            box-shadow: 0 0 15px var(--card-border-glow);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--accent-color);
        }

        .avatar-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px dashed rgba(120, 140, 255, 0.5);
            animation: rotateRing 20s linear infinite;
        }

        @keyframes rotateRing {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .profile-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .profile-bio {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-muted);
            text-align: center;
        }

        .social-header-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            margin-bottom: 24px;
        }

        .social-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn:hover {
            transform: scale(1.15);
            filter: drop-shadow(0 0 8px var(--accent-glow));
            color: var(--accent-color);
        }

        .section-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
            margin: 24px 0 12px 0;
            width: 100%;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 56px;
            padding: 0 20px;
            background-color: var(--btn-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            text-decoration: none;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .link-pill:hover {
            background-color: var(--btn-bg-hover);
            border-color: rgba(120, 140, 255, 0.6);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transform: scale(1.02);
        }

        .link-icon {
            position: absolute;
            left: 18px;
            font-size: 22px;
            width: 24px;
            text-align: center;
            color: var(--text-main);
        }

        .link-text {
            text-align: center;
            width: 100%;
            padding: 0 40px;
            /* leaves room for icons on sides */
        }

        .link-share {
            position: absolute;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            transition: all 0.2s ease;
            cursor: pointer;
            z-index: 2;
        }

        .link-share:hover {
            opacity: 1;
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.15);
        }

        footer {
            margin-top: 60px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(148, 163, 184, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            z-index: 10;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 15, 30, 0.95);
            border: 1px solid var(--accent-color);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 15px var(--accent-glow);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .toast i {
            color: #10b981;
            font-size: 16px;
        }

        /* Share Modal Overlay */
        .share-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 12, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            padding: 16px;
        }

        .share-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Share Modal Content Card */
        .share-modal-content {
            background: rgba(18, 18, 38, 0.92);
            border: 1px solid var(--card-border);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.7), 0 0 30px var(--card-border-glow);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: scale(0.92);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .share-modal-overlay.active .share-modal-content {
            transform: scale(1);
        }

        .share-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .share-modal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 12px;
        }

        .share-modal-close {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.2s;
            flex-shrink: 0;
        }

        .share-modal-close:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            transform: scale(1.08);
        }

        .share-modal-url {
            font-family: 'Space Grotesk', monospace;
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(8, 8, 20, 0.6);
            border: 1px solid rgba(120, 140, 255, 0.15);
            padding: 10px 14px;
            border-radius: 12px;
            word-break: break-all;
            user-select: all;
            max-height: 70px;
            overflow-y: auto;
        }

        .share-modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }

        .share-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 50px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .share-action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(120, 140, 255, 0.6);
            transform: translateY(-2px);
        }

        .share-action-btn.primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .share-action-btn.primary:hover {
            background: linear-gradient(135deg, #7174f8, #5b53ee);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="stars"></div>

    <div class="container">
        <!-- Avatar and Profile Info -->
        <div class="avatar-wrapper">
            <div class="avatar-ring"></div>
            <div class="avatar">
                <img src="/picture/avatar/WASABISOCUTE.jpg" alt="Avatar"
                    style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
            </div>
        </div>
        <h1 class="profile-name">WASABISOCUTE</h1>
        <p class="profile-bio">( ﹡ˆoˆ﹡ )</p>

        <!-- Social Icons in Header -->
        <div class="social-header-row" id="social-header-container"></div>

        <!-- Link Sections Container -->
        <div id="link-sections-container" style="width: 100%;"></div>

    </div>

    <footer>
        &copy; 2026 WASABISOCUTE
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-message">链接已复制到剪贴板</span>
    </div>

    <!-- Share Modal -->
    <div id="share-modal" class="share-modal-overlay">
        <div class="share-modal-content">
            <div class="share-modal-header">
                <div class="share-modal-title" id="share-modal-title">Link Title</div>
                <button class="share-modal-close" id="share-modal-close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="share-modal-url" id="share-modal-url">https://...</div>
            <div class="share-modal-actions">
                <button class="share-action-btn primary" id="share-btn-copy">
                    <i class="fa-solid fa-copy"></i>
                    <span>复制链接 / Copy Link</span>
                </button>
                <button class="share-action-btn" id="share-btn-native">
                    <i class="fa-solid fa-share-nodes"></i>
                    <span>分享 / Share</span>
                </button>
                <button class="share-action-btn" id="share-btn-open">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span>新标签页打开 / Open in New Tab</span>
                </button>
            </div>
        </div>
    </div>

    <script src="link.js"></script>
</body>

</html>
